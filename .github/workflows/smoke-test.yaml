name: Smoke Test

on:
  workflow_run:
    workflows: ["Publish image to GHCR"]   # must match publish.yaml's `name:` exactly
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}   # the exact commit publish built

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Create cluster
        run: k3d cluster create ci --wait

      - name: Apply CRD
        run: kubectl apply -f resourcedefinition.yaml

      - name: Wait for CRD to be established
        run: kubectl wait --for=condition=Established crd/dummysites.samuel.jinadu --timeout=30s

      - name: Apply sample DummySite
        run: kubectl apply -f dummysite.yaml

      - name: Sample DummySite exists
        run: kubectl get dsite sample

      - name: Apply RBAC and controller (pinned to the SHA we just published)
        run: |
          kubectl apply -f serviceaccount.yaml
          kubectl apply -f clusterrole.yaml
          kubectl apply -f clusterrolebinding.yaml
          kubectl apply -f deployment.yaml
          kubectl set image deploy/dummysite-controller \
            controller=ghcr.io/samuel-jinadu/dummysite-controller:${{ github.event.workflow_run.head_sha }}
          kubectl rollout status deploy/dummysite-controller --timeout=120s

      - name: Replay test (controller saw the pre-existing sample on startup)
        run: |
          for i in $(seq 1 30); do
            kubectl logs deploy/dummysite-controller --tail=200 2>/dev/null \
              | grep -q "ADDED.*default/sample" && exit 0
            sleep 2
          done
          kubectl logs deploy/dummysite-controller --tail=200
          exit 1
        
      - name: Resources created for sample DummySite
        run: |
          kubectl get configmap dummysite-sample
          kubectl get pod dummysite-sample
          kubectl wait --for=condition=Ready pod/dummysite-sample --timeout=90s

      - name: Serve sample DummySite and verify content
        run: |
          kubectl port-forward pod/dummysite-sample 8080:80 >/dev/null 2>&1 &
          PF_PID=$!
          trap "kill $PF_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080 | grep -qi "example domain"; then
              echo "Content OK"
              exit 0
            fi
            sleep 1
          done
          curl -sv http://localhost:8080 || true
          exit 1
      - name: Apply a live DummySite
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: samuel.jinadu/v1
          kind: DummySite
          metadata:
            name: live-test
          spec:
            website_url: https://example.org
          EOF

      - name: Live event test (controller received a fresh ADDED via watch)
        run: |
          for i in $(seq 1 15); do
            kubectl logs deploy/dummysite-controller --tail=200 2>/dev/null \
              | grep -q "ADDED.*default/live-test" && exit 0
            sleep 2
          done
          kubectl logs deploy/dummysite-controller --tail=200
          exit 1

      - name: Cleanup
        if: always()
        run: k3d cluster delete ci