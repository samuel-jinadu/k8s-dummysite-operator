apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dummysites.samuel.jinadu
spec:
  group: samuel.jinadu
  scope: Namespaced
  names:
    kind: DummySite
    plural: dummysites
    singular: dummysite
    shortNames:
    - ds
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [website_url]
              properties:
                website_url:
                  type: string
                  pattern: '^https?://[^\s]+$'
                  maxLength: 2048
      additionalPrinterColumns:
        - name: Website URL
          type: string
          description: The url of the dummy site
          jsonPath: .spec.website_url